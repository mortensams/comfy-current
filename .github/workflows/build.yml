name: Build evergreen ComfyUI image

on:
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up the newest runpod/comfyui base (CUDA, torch,
    # system libs) and fresh clones of the default custom nodes.
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start-evergreen.sh
      - default-nodes.txt
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          build-args: |
            BASE_IMAGE=runpod/comfyui:cuda13.0
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-evergreen:cuda13.0
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-evergreen:latest
