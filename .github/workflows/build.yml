name: Build evergreen ComfyUI image

on:
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up the newest runpod/comfyui base (CUDA, torch,
    # system libs) and fresh clones of the default custom nodes.
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - start-evergreen.sh
      - default-nodes.txt
      - .github/workflows/build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          build-args: |
            BASE_IMAGE=runpod/comfyui:cuda13.0
          tags: |
            ghcr.io/${{ github.repository }}:cuda13.0
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
